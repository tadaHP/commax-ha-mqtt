spring:
  application:
    name: Wallpadcontroller
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  datasource:
    # 프로필 없이 기동 시 인메모리 H2 (비영속). docker/develop에서 URL 오버라이드.
    url: jdbc:h2:mem:wallpad;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}

mqtt:
  host: ${MQTT_HOST:localhost}
  port: ${MQTT_PORT:1883}
  client-id: ${MQTT_CLIENT_ID:wallpad-controller}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  ha-topic: ${MQTT_HA_TOPIC:commax}

ew11:
  transport: ${EW11_TRANSPORT:mqtt}
  mqtt:
    send-topic: ${EW11_MQTT_SEND_TOPIC:ew11/send}
    receive-topic: ${EW11_MQTT_RECEIVE_TOPIC:ew11/recv}
  udp:
    send:
      host: ${EW11_UDP_SEND_HOST:127.0.0.1}
      port: ${EW11_UDP_SEND_PORT:52493}
    listen:
      port: ${EW11_UDP_LISTEN_PORT:54747}
      buffer-size: ${EW11_UDP_BUFFER_SIZE:512}
  reboot:
    enabled: ${EW11_REBOOT_ENABLED:false}
    host: ${EW11_REBOOT_HOST:}
    username: ${EW11_REBOOT_USERNAME:}
    password: ${EW11_REBOOT_PASSWORD:}
    interval: ${EW11_REBOOT_INTERVAL:12h}
