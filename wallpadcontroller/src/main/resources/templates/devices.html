<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('등록 기기 관리')}"></head>
<style>
    .device-action-cell {
        background-color: #f8fafc !important;
        box-shadow: inset 0 0 0 1px #e2e8f0;
    }
    .device-filter-select {
        background-color: #ffffff !important;
        color: #0f172a !important;
        border: 1px solid #94a3b8 !important;
        border-radius: 0.375rem;
        padding: 0.5rem 0.75rem;
        font-size: 0.875rem;
        min-width: 10.5rem;
    }
    .device-toggle-btn {
        display: inline-block;
        border-radius: 0.375rem;
        padding: 0.375rem 0.75rem;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        border: 2px solid transparent;
        transition: background-color 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .device-toggle-btn:disabled {
        cursor: default;
        opacity: 1;
    }
    .device-toggle-btn--active {
        background-color: #047857 !important;
        color: #ffffff !important;
        border-color: #065f46 !important;
    }
    .device-toggle-btn--active:not(:disabled):hover {
        background-color: #059669 !important;
    }
    .device-toggle-btn--active:disabled {
        box-shadow: inset 0 0 0 2px #065f46;
    }
    .device-toggle-btn--inactive {
        background-color: #ffffff !important;
        color: #475569 !important;
        border-color: #94a3b8 !important;
    }
    .device-toggle-btn--inactive:not(:disabled):hover {
        background-color: #f1f5f9 !important;
        border-color: #64748b !important;
    }
    .device-toggle-btn--inactive:disabled {
        background-color: #e2e8f0 !important;
        color: #334155 !important;
        border-color: #64748b !important;
    }
</style>
<body class="bg-gray-100 font-sans">
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container mx-auto p-8 max-w-6xl">
    <h1 class="text-3xl font-bold text-gray-800 mb-2">등록 기기 관리</h1>
    <p class="text-gray-600 mb-6 text-sm">
        새로 잡힌 기기는 기본 비활성입니다. <strong>활성</strong>으로 바꾼 기기만 Home Assistant discovery 및 상태 MQTT에 반영됩니다.
        현재 상태는 <strong>MQTT/HA</strong> 열에서 확인하고, 오른쪽 버튼으로 바로 전환할 수 있습니다.
    </p>

    <div id="deviceSaveBanner" class="hidden mb-4 p-3 rounded text-sm"></div>
    <div th:if="${message}" class="mb-4 p-3 rounded bg-green-100 text-green-900 text-sm" th:text="${message}"></div>
    <div th:if="${error}" class="mb-4 p-3 rounded bg-red-100 text-red-900 text-sm" th:text="${error}"></div>

    <form method="get" th:action="@{/devices}" class="flex flex-wrap items-end gap-3 mb-4">
        <div>
            <label for="deviceUsedFilter" class="block text-sm font-medium text-gray-700 mb-1">MQTT/HA 노출 상태</label>
            <select id="deviceUsedFilter" name="used"
                    class="device-filter-select min-w-[12rem]"
                    onchange="this.form.submit()">
                <option value="all" th:selected="${filterUsed == 'all'}">전체</option>
                <option value="active" th:selected="${filterUsed == 'active'}">활성</option>
                <option value="inactive" th:selected="${filterUsed == 'inactive'}">비활성</option>
            </select>
        </div>
    </form>

    <div class="bg-white rounded-lg shadow overflow-x-auto">
        <table class="min-w-full text-sm">
            <thead class="bg-slate-100 text-left text-slate-700">
            <tr>
                <th class="px-4 py-3 font-semibold">타입</th>
                <th class="px-4 py-3 font-semibold">인덱스</th>
                <th class="px-4 py-3 font-semibold font-mono text-xs">object_id (HA entity 이름)</th>
                <th class="px-4 py-3 font-semibold max-w-[12rem]">unique_id</th>
                <th class="px-4 py-3 font-semibold">MQTT/HA</th>
                <th class="px-4 py-3 font-semibold min-w-[11rem] whitespace-nowrap sticky right-0 z-20 bg-slate-100 border-l border-slate-200 shadow-sm">변경</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="d : ${devices}" class="border-t border-gray-200 hover:bg-gray-50">
                <td class="px-4 py-3" th:text="${d.type}">Light</td>
                <td class="px-4 py-3" th:text="${d.index}">1</td>
                <td class="px-4 py-3 font-mono text-xs align-top" th:text="${d.objectId}" th:title="${d.objectId}">ev_status_1</td>
                <td class="px-4 py-3 font-mono text-xs max-w-[12rem] truncate align-top" th:text="${d.uniqueId}" th:title="${d.uniqueId}">id</td>
                <td class="px-4 py-3">
                    <span th:if="${d.used != false}" class="text-green-700 font-medium">활성</span>
                    <span th:if="${d.used == false}" class="text-gray-500">비활성</span>
                </td>
                <td class="device-action-cell px-4 py-3 sticky right-0 z-10 border-l border-slate-300 shadow-md align-top">
                    <div class="flex flex-wrap items-center gap-2" data-device-mqtt-toggle th:attr="data-unique-id=${d.uniqueId}">
                        <button type="button"
                                class="device-toggle-btn device-toggle-btn--active"
                                data-mode="on"
                                th:disabled="${d.used != false}">
                            활성
                        </button>
                        <button type="button"
                                class="device-toggle-btn device-toggle-btn--inactive"
                                data-mode="off"
                                th:disabled="${d.used == false}">
                            비활성
                        </button>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
        <p th:if="${#lists.isEmpty(devices)}" class="p-6 text-gray-500 text-sm">등록된 기기가 없습니다.</p>
    </div>
</div>
<script th:inline="javascript">
/*<![CDATA[*/
(function () {
    const MQTT_MODE_URL = /*[[@{/api/devices/mqtt-mode}]]*/ '/api/devices/mqtt-mode';
    const banner = document.getElementById('deviceSaveBanner');

    function showBanner(ok, text) {
        if (!banner) return;
        banner.classList.remove('hidden', 'bg-green-100', 'text-green-900', 'bg-red-100', 'text-red-900');
        if (ok) {
            banner.classList.add('bg-green-100', 'text-green-900');
        } else {
            banner.classList.add('bg-red-100', 'text-red-900');
        }
        banner.textContent = text;
    }

    document.querySelectorAll('[data-device-mqtt-toggle]').forEach(function (group) {
        group.querySelectorAll('button[data-mode]').forEach(function (btn) {
            btn.addEventListener('click', async function () {
                if (btn.disabled) return;
                const uniqueId = group.getAttribute('data-unique-id');
                const mode = btn.getAttribute('data-mode');
                group.querySelectorAll('button[data-mode]').forEach(function (b) { b.disabled = true; });
                try {
                    const res = await fetch(MQTT_MODE_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ uniqueId: uniqueId, mode: mode })
                    });
                    const data = await res.json().catch(function () { return {}; });
                    if (res.ok && data.ok) {
                        var sel = document.getElementById('deviceUsedFilter');
                        var v = sel ? (sel.value || 'all') : 'all';
                        var qs = v === 'all' ? '' : ('?used=' + encodeURIComponent(v));
                        window.location.href = /*[[@{/devices}]]*/ '/devices' + qs;
                    } else {
                        group.querySelectorAll('button[data-mode]').forEach(function (b) { b.disabled = false; });
                        showBanner(false, data.error || ('HTTP ' + res.status));
                    }
                } catch (err) {
                    group.querySelectorAll('button[data-mode]').forEach(function (b) { b.disabled = false; });
                    showBanner(false, '요청 실패: ' + (err && err.message ? err.message : String(err)));
                }
            });
        });
    });
})();
/*]]>*/
</script>
</body>
</html>
