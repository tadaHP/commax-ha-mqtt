<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('실시간 패킷 캡처')}"></head>
<body class="bg-gray-100 font-sans">
    <div th:replace="~{fragments/nav :: nav}"></div>
    <div class="container mx-auto p-8">
        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-4">
            <h1 class="text-3xl font-bold text-gray-800">실시간 패킷 캡처</h1>
            <div class="flex flex-wrap items-center gap-2">
                <button id="startCaptureBtn" type="button" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded">
                    캡처 시작
                </button>
                <button id="stopCaptureBtn" type="button" class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded disabled:opacity-50" disabled>
                    캡처 중지
                </button>
                <button id="clearBtn" type="button" class="bg-gray-600 hover:bg-gray-700 text-white font-semibold py-2 px-4 rounded">
                    화면 지우기
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
            <div>
                <label for="filterDropdown" class="block text-sm font-medium text-gray-700 mb-1">패킷</label>
                <select id="filterDropdown" class="w-full bg-white border border-gray-300 rounded px-3 py-2 shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="ALL">전체</option>
                    <option value="UNKNOWN">Unknown (미등록 헤더)</option>
                    <optgroup th:each="group : ${packetTypeGroups}" th:label="${group.key}">
                        <option th:value="${'GROUP_' + group.key}" th:text="${group.key + ' (전체)'}"></option>
                        <option th:each="type : ${group.value}" th:value="${type.header}" th:text="${type.displayName}"></option>
                    </optgroup>
                </select>
            </div>
            <div>
                <label for="statusFilter" class="block text-sm font-medium text-gray-700 mb-1">상태</label>
                <select id="statusFilter" class="w-full bg-white border border-gray-300 rounded px-3 py-2 shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="ALL">전체</option>
                    <option value="SUCCESS">SUCCESS</option>
                    <option value="UNKNOWN_HEADER">Unknown</option>
                </select>
            </div>
            <div>
                <label for="searchInput" class="block text-sm font-medium text-gray-700 mb-1">검색</label>
                <input type="text" id="searchInput" placeholder="원문·메모에 포함되는 문자열 (공백으로 AND)"
                       class="w-full bg-white border border-gray-300 rounded px-3 py-2 shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
        </div>
        <p class="text-sm text-gray-600 mb-4">패킷·상태·검색 조건을 <strong>모두</strong> 만족하는 행만 표시됩니다. 검색어가 비어 있으면 검색 조건은 적용되지 않습니다.</p>

        <div id="capture-container" class="bg-white shadow-md rounded-lg p-4 space-y-2 min-h-[120px]"></div>
    </div>

<script th:inline="javascript">
    /*<![CDATA[*/

    const startBtn = document.getElementById('startCaptureBtn');
    const stopBtn = document.getElementById('stopCaptureBtn');
    const clearBtn = document.getElementById('clearBtn');
    const container = document.getElementById('capture-container');
    const filterDropdown = document.getElementById('filterDropdown');
    const statusFilter = document.getElementById('statusFilter');
    const searchInput = document.getElementById('searchInput');
    let eventSource;

    const packetTypeGroups = /*[[${packetTypeGroups}]]*/ {};

    const headerToDisplayName = {};
    const headerToGroupNameMap = {};
    for (const [groupName, types] of Object.entries(packetTypeGroups)) {
        for (const type of types) {
            headerToDisplayName[type.header] = type.displayName;
            headerToGroupNameMap[type.header] = groupName;
        }
    }
    const knownHeaders = Object.keys(headerToDisplayName);

    let currentPacketFilter = 'ALL';
    let currentStatusFilter = 'ALL';
    let searchTerms = [];

    function normalizeHexSpaces(s) {
        return (s || '').replace(/\s+/g, '').toUpperCase();
    }

    function refreshSearchTerms() {
        const raw = searchInput.value.trim();
        searchTerms = raw ? raw.split(/\s+/).filter(t => t.length > 0) : [];
    }

    function passesPacketTypeFilter(packetEl) {
        const header = packetEl.dataset.header;
        const groupName = packetEl.dataset.groupName || '';
        const isKnown = packetEl.dataset.isKnown === 'true';
        const isGroupFilter = currentPacketFilter.startsWith('GROUP_');
        const groupFilterName = isGroupFilter ? currentPacketFilter.substring(6) : null;

        if (isGroupFilter) {
            return groupName === groupFilterName;
        }
        if (currentPacketFilter === 'ALL') {
            return true;
        }
        if (currentPacketFilter === 'UNKNOWN') {
            return !isKnown;
        }
        return currentPacketFilter === header;
    }

    function passesStatusFilter(packetEl) {
        if (currentStatusFilter === 'ALL') {
            return true;
        }
        return (packetEl.dataset.status || '') === currentStatusFilter;
    }

    function passesSearchFilter(packetEl) {
        if (searchTerms.length === 0) {
            return true;
        }
        const raw = normalizeHexSpaces(packetEl.dataset.rawData || '');
        const notes = (packetEl.dataset.notes || '').toUpperCase();
        const blob = raw + ' ' + notes;
        return searchTerms.every(term => {
            const t = term.toUpperCase();
            const tCompact = normalizeHexSpaces(term);
            return blob.includes(t) || raw.includes(tCompact) || notes.includes(t);
        });
    }

    function applyAllFilters() {
        container.querySelectorAll('.packet-entry').forEach(packetEl => {
            const show = passesPacketTypeFilter(packetEl) && passesStatusFilter(packetEl) && passesSearchFilter(packetEl);
            packetEl.style.display = show ? 'flex' : 'none';
        });
    }

    searchInput.addEventListener('input', () => {
        refreshSearchTerms();
        applyAllFilters();
    });

    filterDropdown.addEventListener('change', () => {
        currentPacketFilter = filterDropdown.value;
        applyAllFilters();
    });

    statusFilter.addEventListener('change', () => {
        currentStatusFilter = statusFilter.value;
        applyAllFilters();
    });

    startBtn.addEventListener('click', async () => {
        try {
            await fetch('/capture/start', { method: 'POST' });
            startBtn.disabled = true;
            stopBtn.disabled = false;

            eventSource = new EventSource('/capture/events');
            eventSource.addEventListener('packet', event => {
                const packet = JSON.parse(event.data);
                addPacketToView(packet);
            });

            eventSource.onerror = () => {
                stopCapture();
            };
        } catch (error) {
            console.error('Error starting capture:', error);
        }
    });

    const stopCapture = async () => {
        if (eventSource) {
            eventSource.close();
            eventSource = null;
        }
        try {
            await fetch('/capture/stop', { method: 'POST' });
        } finally {
            startBtn.disabled = false;
            stopBtn.disabled = true;
        }
    };

    stopBtn.addEventListener('click', stopCapture);
    clearBtn.addEventListener('click', () => {
        container.innerHTML = '';
    });

    function getPacketHeader(rawData) {
        if (!rawData) {
            return '';
        }
        const compact = rawData.replace(/\s+/g, '').toUpperCase();
        return compact.length >= 2 ? compact.substring(0, 2) : '';
    }

    function addPacketToView(packet) {
        const rawData = packet.rawData || '';
        const header = getPacketHeader(rawData);
        const isKnown = knownHeaders.includes(header);
        const groupName = headerToGroupNameMap[header];
        const displayName = headerToDisplayName[header] || 'Unknown';
        const status = packet.status || '';

        const packetEl = document.createElement('div');
        packetEl.className = 'packet-entry font-mono text-sm p-2 border-b border-gray-100 flex justify-between items-center gap-2 flex-wrap';
        packetEl.dataset.header = header;
        packetEl.dataset.isKnown = String(isKnown);
        packetEl.dataset.groupName = groupName || '';
        packetEl.dataset.rawData = rawData;
        packetEl.dataset.notes = packet.notes || '';
        packetEl.dataset.status = status;

        const received = packet.receivedAt ? new Date(packet.receivedAt) : new Date();
        const timeStr = received.toLocaleTimeString();
        const headerText = `${header} (${displayName})`;
        const statusLabel = status === 'UNKNOWN_HEADER' ? 'Unknown' : status;

        packetEl.innerHTML = `
            <span class="break-all">[${timeStr}] ${rawData}</span>
            <span class="text-xs font-semibold text-gray-600 shrink-0">${headerText} · <span class="text-indigo-600">${statusLabel}</span></span>
        `;

        container.prepend(packetEl);
        applyAllFilters();
    }

    /*]]>*/
</script>
</body>
</html>
