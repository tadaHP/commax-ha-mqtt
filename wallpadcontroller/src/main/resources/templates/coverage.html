<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('기기별 패킷 관측 현황')}"></head>
<body id="coverage-page" class="bg-gray-100 font-sans"
      th:data-api-coverage="@{/api/coverage}">
    <div th:replace="~{fragments/nav :: nav}"></div>
    <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
        <div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">기기별 패킷 관측 현황</h1>
                <p class="mt-1 text-sm text-gray-600">기기 타입과 번호별로 한 번이라도 수신 또는 송신된 패킷을 확인합니다.</p>
            </div>
            <a href="/seen-packets" class="inline-flex items-center justify-center rounded-md border border-gray-300 bg-white px-3 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50">
                관측 패킷 목록
            </a>
        </div>

        <div id="summaryLine" class="mb-4 text-sm text-gray-600">패킷 관측 데이터를 불러오는 중...</div>
        <div id="errorLine" class="hidden mb-4 rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"></div>
        <div id="deviceSections" class="space-y-8"></div>
    </main>

    <script th:inline="none">
/*<![CDATA[*/
(function () {
    const root = document.getElementById('coverage-page');
    const API_URL = root.getAttribute('data-api-coverage');
    const summaryLine = document.getElementById('summaryLine');
    const errorLine = document.getElementById('errorLine');
    const deviceSections = document.getElementById('deviceSections');

    function escapeHtml(text) {
        return String(text == null ? '' : text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function formatDateTime(value) {
        if (!value) return '';
        return String(value).replace('T', ' ').slice(0, 19);
    }

    function directionBadge(seen, label, color) {
        const cls = seen
            ? (color === 'in' ? 'bg-emerald-50 text-emerald-700 ring-emerald-200' : 'bg-blue-50 text-blue-700 ring-blue-200')
            : 'bg-gray-50 text-gray-400 ring-gray-200';
        return '<span class="inline-flex min-w-14 justify-center rounded px-2 py-1 text-xs font-semibold ring-1 ring-inset ' + cls + '">' +
            escapeHtml(label) + '</span>';
    }

    function renderPacketList(title, packets) {
        if (!packets || packets.length === 0) {
            return '';
        }
        const rows = packets.map(function (packet) {
            return '<li class="rounded border border-gray-200 bg-gray-50 px-2 py-1">' +
                '<div class="break-all font-mono text-[11px] text-gray-900">' + escapeHtml(packet.rawData) + '</div>' +
                '<div class="mt-0.5 text-[11px] text-gray-500">최근 ' + escapeHtml(formatDateTime(packet.lastSeenAt)) + '</div>' +
                '</li>';
        }).join('');
        return '<details class="mt-2">' +
            '<summary class="cursor-pointer text-xs font-semibold text-gray-600">' + escapeHtml(title) + ' ' + packets.length + '건</summary>' +
            '<ul class="mt-2 space-y-1">' + rows + '</ul>' +
            '</details>';
    }

    function renderKind(kind) {
        const hasAny = kind.inboundSeen || kind.outboundSeen;
        const lastSeen = formatDateTime(kind.lastSeenAt);
        return '<div class="border-t border-gray-200 py-3 first:border-t-0 first:pt-0 last:pb-0">' +
            '<div class="flex flex-wrap items-center justify-between gap-2">' +
            '<div class="min-w-0">' +
            '<div class="flex flex-wrap items-center gap-2">' +
            '<span class="font-mono text-sm font-semibold text-gray-900">' + escapeHtml(kind.header) + '</span>' +
            '<span class="text-sm font-medium text-gray-800">' + escapeHtml(kind.name) + '</span>' +
            '</div>' +
            '<div class="mt-1 text-xs text-gray-500">' + (hasAny ? '최근 ' + escapeHtml(lastSeen) : '관측 없음') + '</div>' +
            '</div>' +
            '<div class="flex shrink-0 gap-1">' +
            directionBadge(kind.inboundSeen, '수신', 'in') +
            directionBadge(kind.outboundSeen, '송신', 'out') +
            '</div>' +
            '</div>' +
            renderPacketList('수신 raw', kind.inboundPackets) +
            renderPacketList('송신 raw', kind.outboundPackets) +
            '</div>';
    }

    function renderInstance(instance) {
        const seenKinds = (instance.packetKinds || []).filter(function (kind) {
            return kind.inboundSeen || kind.outboundSeen;
        }).length;
        const kindsHtml = (instance.packetKinds || []).map(renderKind).join('');
        return '<article class="rounded-lg bg-white p-4 shadow-sm ring-1 ring-gray-200">' +
            '<div class="mb-3 flex items-center justify-between gap-3">' +
            '<h3 class="text-lg font-bold text-gray-900">' + escapeHtml(instance.displayName) + '</h3>' +
            '<span class="rounded bg-gray-100 px-2 py-1 text-xs font-semibold text-gray-600">' + seenKinds + '/' + (instance.packetKinds || []).length + '</span>' +
            '</div>' +
            '<div>' + kindsHtml + '</div>' +
            '</article>';
    }

    function renderDeviceType(deviceType) {
        const instances = deviceType.instances || [];
        const cards = instances.map(renderInstance).join('');
        return '<section>' +
            '<div class="mb-3 flex items-center justify-between border-b border-gray-300 pb-2">' +
            '<div>' +
            '<h2 class="text-xl font-bold text-gray-900">' + escapeHtml(deviceType.name) + '</h2>' +
            '<p class="text-xs text-gray-500">' + escapeHtml(deviceType.type || '') + ' · ' + instances.length + '개 기기</p>' +
            '</div>' +
            '</div>' +
            '<div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3">' + cards + '</div>' +
            '</section>';
    }

    function render(data) {
        if (!data || data.length === 0) {
            deviceSections.innerHTML = '<div class="rounded-lg bg-white p-8 text-center text-sm text-gray-500 shadow-sm ring-1 ring-gray-200">표시할 기기 또는 관측 패킷이 없습니다.</div>';
            summaryLine.textContent = '기기 0개';
            return;
        }
        const instanceCount = data.reduce(function (sum, deviceType) {
            return sum + ((deviceType.instances || []).length);
        }, 0);
        deviceSections.innerHTML = data.map(renderDeviceType).join('');
        summaryLine.textContent = '기기 타입 ' + data.length + '개 · 기기 ' + instanceCount + '개';
    }

    async function loadCoverage() {
        errorLine.classList.add('hidden');
        errorLine.textContent = '';
        try {
            const res = await fetch(API_URL);
            if (!res.ok) {
                throw new Error('HTTP ' + res.status);
            }
            const data = await res.json();
            render(data);
        } catch (e) {
            summaryLine.textContent = '';
            deviceSections.innerHTML = '';
            errorLine.textContent = '패킷 관측 데이터를 불러오지 못했습니다. ' + (e.message || e);
            errorLine.classList.remove('hidden');
        }
    }

    loadCoverage();
})();
/*]]>*/
    </script>
</body>
</html>
