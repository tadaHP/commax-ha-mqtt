<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('패킷 수신 현황 대시보드')}"></head>
<body id="coverage-page" class="bg-gray-100 font-sans"
      th:data-api-coverage="@{/api/coverage}">
    <div th:replace="~{fragments/nav :: nav}"></div>
    <div class="container mx-auto p-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-4">패킷 수신 현황 대시보드</h1>

        <div id="errorLine" class="hidden mb-4 rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"></div>
        <div id="loadingLine" class="mb-6 text-gray-600 text-sm">커버리지 데이터를 불러오는 중…</div>

        <div id="deviceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>

        <div class="mt-8 text-center">
            <a href="/seen-packets" class="text-blue-500 hover:underline">관측된 유니크 패킷 보기 &rarr;</a>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
    <script th:inline="none">
/*<![CDATA[*/
(function () {
    const root = document.getElementById('coverage-page');
    const API_URL = root.getAttribute('data-api-coverage');
    const deviceGrid = document.getElementById('deviceGrid');
    const loadingLine = document.getElementById('loadingLine');
    const errorLine = document.getElementById('errorLine');

    const STATUS_META = {
        COMPLETE: { dot: 'bg-green-500', label: 'COMPLETE' },
        PARTIAL: { dot: 'bg-orange-500', label: 'PARTIAL' },
        NEW_DETECTED: { dot: 'bg-blue-500', label: 'NEW' },
        MISSING: { dot: 'bg-red-500', label: 'MISSING' }
    };

    function escapeHtml(text) {
        return String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function statusBadge(status) {
        const meta = STATUS_META[status] || STATUS_META.MISSING;
        return '<div class="flex items-center">' +
            '<span class="h-2.5 w-2.5 rounded-full ' + meta.dot + '"></span>' +
            '<span class="ml-2 text-xs font-medium text-gray-600">' + meta.label + '</span>' +
            '</div>';
    }

    function renderFieldRows(values, isNew) {
        return values.map(function (value) {
            if (isNew) {
                return '<tr class="hover:bg-gray-50">' +
                    '<td class="py-1 pr-2 font-semibold">NEW (' + escapeHtml(value.hexValue) + ')</td>' +
                    '<td class="py-1 text-right"><span class="text-blue-600 font-bold">NEW VALUE</span></td>' +
                    '</tr>';
            }
            const cls = value.received ? 'text-green-600' : 'text-red-500';
            const label = value.received ? 'RECEIVED' : 'MISSING';
            return '<tr class="hover:bg-gray-50">' +
                '<td class="py-1 pr-2">' + escapeHtml(value.rawKey) + ' (' + escapeHtml(value.hexValue) + ')</td>' +
                '<td class="py-1 text-right"><span class="' + cls + ' font-bold">' + label + '</span></td>' +
                '</tr>';
        }).join('');
    }

    function renderDevices(devices) {
        deviceGrid.innerHTML = devices.map(function (device, deviceIndex) {
            const kindsHtml = (device.kinds || []).map(function (kind, kindIndex) {
                const accordionId = 'accordion-body-' + deviceIndex + '-' + kindIndex;
                const headingId = 'accordion-heading-' + deviceIndex + '-' + kindIndex;
                const fieldsHtml = (kind.fields || []).map(function (field) {
                    return '<div class="mt-2 first:mt-0">' +
                        '<h4 class="text-sm font-semibold text-gray-700">' + escapeHtml(field.name) + '</h4>' +
                        '<table class="mt-1 w-full text-xs"><tbody>' +
                        renderFieldRows(field.definedValues || [], false) +
                        renderFieldRows(field.newValues || [], true) +
                        '</tbody></table></div>';
                }).join('');
                const emptyFields = (!kind.fields || kind.fields.length === 0)
                    ? '<div class="text-xs text-gray-500">상세 필드 정보가 없습니다.</div>'
                    : fieldsHtml;
                return '<h2 id="' + headingId + '">' +
                    '<button type="button" class="flex items-center justify-between w-full py-3 font-medium text-gray-500 border-b border-gray-200" data-accordion-target="#' + accordionId + '" aria-expanded="false">' +
                    '<span class="text-gray-800 font-semibold">' + escapeHtml(kind.name) + ' (' + escapeHtml(kind.header) + ')</span>' +
                    '<div class="flex items-center">' + statusBadge(kind.status) +
                    '<svg data-accordion-icon class="w-3 h-3 shrink-0 ml-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">' +
                    '<path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5 5 1 1 5"/></svg>' +
                    '</div></button></h2>' +
                    '<div id="' + accordionId + '" class="hidden"><div class="py-4 px-2 border-b border-gray-200">' +
                    emptyFields + '</div></div>';
            }).join('');

            return '<div class="bg-white rounded-lg shadow-md p-6">' +
                '<h2 class="text-xl font-bold text-gray-900 border-b pb-2 mb-4">' + escapeHtml(device.name) + '</h2>' +
                '<div data-accordion="collapse">' + kindsHtml + '</div></div>';
        }).join('');

        if (typeof initAccordions === 'function') {
            initAccordions();
        }
    }

    function showError(message) {
        errorLine.textContent = message;
        errorLine.classList.remove('hidden');
    }

    function hideError() {
        errorLine.classList.add('hidden');
        errorLine.textContent = '';
    }

    async function loadCoverage() {
        hideError();
        loadingLine.classList.remove('hidden');
        try {
            const res = await fetch(API_URL);
            if (!res.ok) {
                throw new Error('HTTP ' + res.status);
            }
            const devices = await res.json();
            renderDevices(devices);
            loadingLine.classList.add('hidden');
        } catch (e) {
            loadingLine.classList.add('hidden');
            showError('커버리지 데이터를 불러오지 못했습니다. ' + e.message);
        }
    }

    loadCoverage();
})();
/*]]>*/
    </script>
</body>
</html>
